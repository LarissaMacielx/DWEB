<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atividade 9 – Funções em JavaScript</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 0 10px; }
    section { border-bottom: 1px solid #ccc; padding-bottom: 14px; margin-bottom: 14px; }
    input { padding: 6px; margin: 4px 4px 4px 0; }
    input[type="number"] { width: 80px; }
    button { padding: 6px 12px; cursor: pointer; }
    .resultado { font-weight: bold; margin: 8px 0 0; }
  </style>
</head>
<body>
  <h1>Atividade 9 – Funções</h1>

  <section>
    <h2>1) Maior de três números</h2>
    <input type="number" id="n1a"> <input type="number" id="n1b"> <input type="number" id="n1c">
    <button type="button" onclick="exercicio1()">Verificar</button>
    <p class="resultado" id="res1"></p>
  </section>

  <section>
    <h2>2) Ordem crescente</h2>
    <input type="number" id="n2a"> <input type="number" id="n2b"> <input type="number" id="n2c">
    <button type="button" onclick="exercicio2()">Ordenar</button>
    <p class="resultado" id="res2"></p>
  </section>

  <section>
    <h2>3) Palíndromo</h2>
    <input type="text" id="texto3" placeholder="Digite uma frase">
    <button type="button" onclick="exercicio3()">Verificar</button>
    <p class="resultado" id="res3"></p>
  </section>

  <section>
    <h2>4) Subconjunto</h2>
    <input type="text" id="p4a" placeholder="Primeira palavra">
    <input type="text" id="p4b" placeholder="Segunda palavra">
    <button type="button" onclick="exercicio4()">Verificar</button>
    <p class="resultado" id="res4"></p>
  </section>

  <section>
    <h2>5) Dia da semana</h2>
    <input type="date" id="data5">
    <button type="button" onclick="exercicio5()">Descobrir</button>
    <p class="resultado" id="res5"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
