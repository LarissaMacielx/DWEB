<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        
        const opcoes = ["pedra", "papel", "tesoura"];

        let escolhaUsuario = prompt("Escolha: pedra, papel ou tesoura").toLowerCase().trim();

        if (!opcoes.includes(escolhaUsuario)) {
            alert("Escolha inválida! Digite pedra, papel ou tesoura.");
        } else {
         
            const indice = Math.floor(Math.random() * 3);
            const escolhaComputador = opcoes[indice];

            let resultado;

            if (escolhaUsuario === escolhaComputador) {
                resultado = "Empate.";
            } else if (escolhaUsuario === "pedra" && escolhaComputador === "tesoura") {
                resultado = "Pedra quebra tesoura. Você ganhou!";
            } else if (escolhaUsuario === "tesoura" && escolhaComputador === "papel") {
                resultado = "Tesoura corta papel. Você ganhou!";
            } else if (escolhaUsuario === "papel" && escolhaComputador === "pedra") {
                resultado = "Papel cobre a pedra. Você ganhou!";
            } else if (escolhaComputador === "pedra" && escolhaUsuario === "tesoura") {
                resultado = "Pedra quebra tesoura. O computador ganhou!";
            } else if (escolhaComputador === "tesoura" && escolhaUsuario === "papel") {
                resultado = "Tesoura corta papel. O computador ganhou!";
            } else {
                resultado = "Papel cobre a pedra. O computador ganhou!";
            }

            alert(
                "Você escolheu: " + escolhaUsuario +
                "\nComputador escolheu: " + escolhaComputador +
                "\n\n" + resultado
            );
        }
    </script>
</body>

</html>
